name: Validate backend
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: sgaf_test
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: sgaf_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sgaf_test -d sgaf_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://sgaf_test:test_only@127.0.0.1:5432/sgaf_test
      TEST_DATABASE_URL: postgresql://sgaf_test:test_only@127.0.0.1:5432/sgaf_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate --config prisma7.config.ts
      - run: npm run migrate:deploy
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
